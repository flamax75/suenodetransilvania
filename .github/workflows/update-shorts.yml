name: Actualizar Shorts

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar los 10 Shorts mas vistos
        run: node scripts/update-shorts.js

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "No hay cambios en los Shorts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualizar Shorts mas vistos"
          git push
